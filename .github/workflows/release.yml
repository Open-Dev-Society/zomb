# Publishes zomb to npm when a version tag (v0.1.0) is pushed, with provenance.
# Trusted publishing needs no token: on npmjs.com, add Open-Dev-Society/zomb and release.yml as the
# package's trusted publisher, with npm publish allowed. Before the package exists there, the first
# publish can use an NPM_TOKEN repo secret instead; npm tries trusted publishing first either way.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: The tag is the version in package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
